# kotowari check の設定（docs/decisions/core/config.md）
decisions:
  # 決定の文書の置き場（docs/decisions/core/decision-documents.md）
  documents: docs/decisions
tests:
  # 印を探す先。クレートごとに明示する。ID がドメインの名前を持つので
  # 別の製品の印が kotowari 自身の要求の裏付けになることはない。
  files:
    - "src/**/*.rs"
    - "crates/kotowari-core/**/*.rs"
    - "crates/kotowari/**/*.rs"
    - "crates/kotowari-source-analysis/**/*.rs"
    - "crates/kotowari-markdown-schema/**/*.rs"
    - "crates/kotowari-markdown-schema-io/**/*.rs"
    - "crates/kotowari-markdown-view/**/*.rs"
    - "crates/kotowari-overview/**/*.rs"
    - "crates/kotowari-mds/**/*.rs"
    - "tests/**/*.rs"
  rust:
    attributes: [kani::proof]
    macros: [proptest]
guides:
  # 利用者向けの使い方の文書。印の指紋を今の決定の文書と照らす（docs/decisions/core/guides.md）
  files:
    - "docs/guides/**/*.md"
mutants:
  equivalents: .kotowari/equivalents.yaml
surface:
  # 利用者から見える kotowari の CLI の面を取り出し、決定の文書に引用されているかを確かめる（docs/decisions/core/surface.md）
  files:
    - "src/**/*.rs"
    - "crates/kotowari-core/src/**/*.rs"
  rules:
    - ".kotowari/rules/surface.yml"

# 文書を英語と日本語の対で持つ。接尾辞の無いファイルが英語、"*.ja.md" が日本語（docs/decisions/core/translation-pairs.md）
languages: [en, ja]
labels:
  ja:
    language_name: 日本語
    index_link: 全体像
    pages: "{n} ページ"
    stale_sections: "見直す節 {n}"
    open_items: "未決 {n}"
    planned_items: "予定 {n}"
    stale_mark: IR が変わってから見直していない
    outline_stale: 未見直し
    superseded: （置き換え済み）
    deferred: （後回し）
    compare_before: 前
    compare_after: 後
    compare_why: 理由
    state_decided: 決定
    state_planned: 予定
    state_open: 未決
    state_dropped: 取り下げ
