# kotowari check の設定（実験003。仕様書の「設定ファイル」の節と判断の記録 A23、A26、A47、A48）
ir: docs/ir
decisions:
  records: docs/decision/records
  adr: docs/decision/adr
tests:
  # 印を探す先。クレートごとに明示する。ID がドメインの名前を持つので
  # 別の製品の印が kotowari 自身の要求の裏付けになることはない。
  files:
    - "src/**/*.rs"
    - "crates/kotowari-core/**/*.rs"
    - "crates/kotowari/**/*.rs"
    - "crates/kotowari-source-analysis/**/*.rs"
    - "crates/kotowari-markdown-schema/**/*.rs"
    - "crates/kotowari-markdown-schema-io/**/*.rs"
    - "crates/kotowari-markdown-view/**/*.rs"
    - "crates/kotowari-overview/**/*.rs"
    - "crates/kotowari-mds/**/*.rs"
    - "tests/**/*.rs"
  rust:
    attributes: [kani::proof]
    macros: [proptest]
guides:
  # 利用者向けの使い方の文書。印の指紋を今の IR と照らす（docs/ir/core/guides.md）
  files:
    - "docs/guides/**/*.md"
mutants:
  equivalents: .kotowari/equivalents.yaml
surface:
  # 利用者から見える kotowari の CLI の面を取り出し、IR に引用されているかを確かめる（docs/ir/core/surface.md）
  files:
    - "src/**/*.rs"
    - "crates/kotowari-core/src/**/*.rs"
  rules:
    - ".kotowari/rules/surface.yml"

changes:
  files:
    - "src/**"
    - "crates/**"
    - "tests/**"
    - "agent/skills/**"
    - "scripts/**"
    - ".github/workflows/**"
    - ".kotowari/**"
    - "Cargo.toml"
    - "Cargo.lock"
    - "lefthook.yml"
    - ".ignore"
    - "PROJECT.md"
    - "CHANGELOG.md"
    - "docs/guides/**"
    - "site/**"
  exclude:
    - "site/dist/**"
    - "site/__pycache__/**"
  records:
    - ".kotowari/changes/*.yaml"

# 文書を英語と日本語の対で持つ。接尾辞の無いファイルが英語、"*.ja.md" が日本語（docs/ir/core/translation-pairs.md）
languages: [en, ja]
labels:
  ja:
    language_name: 日本語
    index_link: 全体像
    pages: "{n} ページ"
    stale_sections: "見直す節 {n}"
    open_items: "未決 {n}"
    planned_items: "予定 {n}"
    stale_mark: IR が変わってから見直していない
    outline_stale: 未見直し
    superseded: （置き換え済み）
    deferred: （後回し）
    compare_before: 前
    compare_after: 後
    compare_why: 理由
    state_decided: 決定
    state_planned: 予定
    state_open: 未決
    state_dropped: 取り下げ
