    conclusion: existing
    reason: |
      I independently judge this branch-wide comparison against the approved public-crate API requirements and the retained contracts of the migrated tests. The original independent quality and conformance reviews at 398575f were complete but failed. I do not turn their historical verdicts into PASS. Their accepted causes are resolved below using later independent affected-boundary and delta receipts through candidate 4d7355d57c13689b2af2c1432e0352b3e935810c. Both required perspectives are present at each stage; none is waived. My own immutable inventory, interval, receipt-digest and identity checks establish that the review chain covers these exact changed files. The implementer record supplies comparison scope, not these reasons or independent approval.

      For schema parsing, extraction and acquisition, the reviewed public functions preserve validated extraction separately from partial extraction, opaque schema construction, read-only parsed documents and findings, and the approved JSON value boundary. The original mutable/schema-construction exposure in cause 4 is closed by private implementation modules and validated ingress, not by banning legitimate Serialize or JSON values. Causes 1 and 2 are closed in both noncore fix reviews by directory-only hidden filtering and filename-sorted traversal; the final correction does not change those algorithms. Cause 6 is closed by using rooted paths for acquisition and caller spellings for result and failure projection. The schema and mds fixtures and migrated compatibility tests remain product-input evidence, not proof of a final artifact build.

      For core input construction and retained results, cause 5 is closed in both core fix reviews by diagnosing nameless headings in full and partial parsing while filtering them only in full parsing. The retained item and its original-line finding coexist without changing CLI eligibility. Cause 4 initially remained only partially closed: moving constructors left a second native admission route with incomplete configuration, disabled-group, identity and original-text checks. Both final reviews independently trace the replacement shared Policy, Originals admission, phase calculations and immutable assembly. Raw Comparison inspection validates consumed configuration before glob construction; the separately useful fact-only evaluate route remains configuration-independent. Disabled facts are discarded before admission; duplicate identities within a group and conflicting actual source text fail; retained models keep the admitted originals. Public acquired facts are allowed inputs, not externally assembled completed reports. These changes implement the existing input, retention and typed-failure requirements rather than a new normalization mode.

      For native acquisition and CLI compatibility, the fix-review stop-precedence findings are closed in both final reviews by per-file IR read/parse before later acquisition, overlap preflight before guide-body reads, and changes then guides then surfaces. Parent-adjudicated A13 and A14 preserve each BASE producer's enumeration identity, display/rule spelling, actual read path and multiplicity separately. Collected native files retain the historical lossy read selection; IR and decision walkers keep original PathBuf reads. Distinct enumeration identities sharing a display or read origin remain distinct, without inode canonicalization or a Unicode behavior improvement. The final reviews directly compare the supported byte/backslash producers with the original BASE. The missing facade result-name finding is closed by same-type lower-result reexports. The list/query JSON-order finding is closed by common fields first, then original variant fields, then query body and reverse references. The other DTO fields, nulls, array ordering, text and exit projections retain the previously reviewed compatibility mapping. This is grounded static closure, not a claim that I executed the CLI suite.

      For source analysis, migrated test discovery, references, guides, surfaces and change-record calculations, the original complete independent receipts cover the existing pure algorithms, source-analysis query assets, direct callers and definition/scenario counterparts. Later review receipts cover every affected delta rather than importing an old successful verdict. The related IR includes all 15 implementer documents, the definition documents of marked requirements and scenarios found in the original and final changed Rust files, and the already reviewed governing rule/table/glossary counterparts for calculation-only changes. Existing marked-test contracts therefore remain part of this judgment after responsibility moves between packages. The new InputMissing label equalities were removed while all independently omitted enabled groups and explicit-empty success remain covered. I reject the inherited change-record wording-deletion proposal: the same five producer fixtures and suffix assertions existed at BASE, their details reach CLI output, and REQ-core-313 preserves that output across restructuring. Moving them to Project does not authorize deleting historical compatibility evidence. The status no-changes-key assertion belongs to the CLI conversion owner and was retained there.

      For optional async adapters, the complete original quality/conformance boundary receipts assess delegation to synchronous operations, bounded blocking submission, clone-shared permits, independent objects, cancellation and external-runtime failures against the approved async requirements. The planning choice to carry the permit into started work satisfies the bound after cancellation without promising interruption. Later corrections do not change those scheduler bytes. No new scheduler package, runtime ownership or unsupported failure oracle is accepted by this record.

      For package configuration, assets, automation and user documentation, the original reviews and noncore correction receipts support the seven-package dependency direction, package-local canonical assets, existing independent version authorities and no-publication staging method. Cause 3 is not closed merely by replacing production version literals: the final conformance review still failed on the dependent next_patch prerelease fixture. The final 755f79c-to-4d7355d dual-perspective delta receipt closes that residual by stripping only the supported prerelease suffix before deriving a different numeric patch version. The operational mismatch, family transformation and production rollback checks remain. The fixture-self-restoration assertion is removed because it measured its own cleanup rather than release rollback. The moved-ownership observations are closed by the corrected mds README location, the three authorized acquisition how_to_verify references and their single related guide fingerprint. A11's two prior schema-location verification references and four legacy-link deletions preserve canonical bytes and the existing unsupported-symlink rule. No requirement behavior, change exclusion or unrelated stale verification reference is revised.

      The existing conclusion means that the reviewed changes implement approved requirements and grounded delegated choices; no unresolved specification gap or semantic deferral is established by the complete receipt chain. It is not acceptance, release authorization or integration PASS. This record does not certify final shipped archives, artifact consumers, locked standalone resolution, full mutation results or runtime tests from source checks or implementer claims. The parent must commit both role records, pin the resulting head and run the final matrix, sealed artifact and frozen-writer full mutation gates plus unfiltered check and review-phase changes against the unchanged original BASE. The 38 requirement and 26 scenario missing-test baseline findings and 54 guide notices remain out of scope and may block strict integration. The earlier constructor/read-only test-after-production deviation remains historical; later repair observations neither erase it nor fabricate RED evidence.
