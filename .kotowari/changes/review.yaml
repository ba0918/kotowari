      "conclusion": "existing",
      "reason": "REQ-core-358 holds by its how_to_verify: agent/skills/kotowari/references/findings.md, agent/skills/kotowari-adopt/SKILL.md and docs/guides/commands/check.md each say the pre-commit hook runs kotowari check with --allow-test-findings and the pre-push hook and CI run it without. The check guide's new section copies TBL-core-047 row for row and says only the exit code changes (REQ-core-357). The option rows, argument-error lists, exit-code tables, help output and stop example in cli.md and check.md follow REQ-core-002, REQ-core-004 and TBL-core-002; the help text matches print_help. The other guide marks only take current fingerprints: those of REQ-core-002, REQ-core-004 and TBL-core-002 changed on this branch, and those of REQ-core-014 and REQ-core-019 were already stale at the base because the previous branch changed their text; the config guide's sections still agree with both (absolute glob elements fall under its absolute-path row, and the hidden-directory exception is stated by path component). Each Japanese guide carries the same change and its consistency record. The CHANGELOG entry under Added describes the flag as a user sees it.",
