      "reason": "Compared 3cfd833: validate_declared_bullet now matches the bullet pattern against marker_line_part, the first line of the lead, so a lazy continuation line that paragraph reading folds into the lead paragraph is no longer matched. REQ-schema-054 limits bullet matching to the part of the original marker line. Line reading already passed only the marker line, so both readings now agree; the finding detail also quotes only the marker line. The test runs both readings on \"- 親\\n続き\" against ^親$ and checks a mismatch on the marker line is still reported; before the fix paragraph reading matched \"親\\n続き\" and failed. Ran it: passes.",
