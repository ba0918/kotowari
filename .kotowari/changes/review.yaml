      "reason": "I checked the non-test change against the finding map, IR document and skill reference requirements. MapContext.title in the private finding_map module had no reader, so dropping it changes no mapping rule or output. The imports in the CLI library ir module and StopReason::WORDINGS are used only by test-only code, so gating them with cfg(test) leaves the non-test build identical, and no public API changes because the touched modules are private. In the test files I confirmed from the diff that only uncalled helper functions, one unused constant and unused imports were removed, with no test function and no requirement mark line added, removed or changed; the two core test files that are also included into the library by path still compile. A forced rebuild of the workspace and of its tests with all features printed no warning lines, and every test passed. The recorded file and IR identities match the current tree and the base.",
