      "conclusion": "existing",
      "reason": "Reviewed against REQ-core-002, REQ-core-004, REQ-core-357, TBL-core-047, TBL-core-002 and the glossary rows error and test-side finding. parse_args takes --allow-test-findings without a value on either side of the command, stops on a second occurrence and on every command other than check (before the early return for changes), as REQ-core-002 and REQ-core-004 state. test_side.rs maps every finding kind: the three untested kinds always, invalid_marker and unresolved_reference when the path is a test file read by the check, unparsable_file when it is such a file and does not match the surface.files globs (the glossary's surface file, matched with the same default globset as the walk), every other kind never; the severity is not consulted, which is sound because every kind in the table is an error. The CLI changes only the exit code: with the flag it is 1 when any error is not a test-side finding, otherwise the old computation; printing is untouched, so output stays identical (REQ-core-357, A4). The tests' expectations match their IDs: EX-core-547 to EX-core-552, the per-row core test of TBL-core-047, the no-rule-language surface case and the identical-output test for both formats. EX-core-551 writes the mark as [ , ] where the scenario says nothing inside; [] gives the same invalid_marker and exit 1, so the expectation holds. Outside the tests, the binary was run on a project whose only errors were an unparsable, an empty-marked and an unresolved-reference test file: exit 0 with the flag, 1 without.",
      "requirements": [
        "REQ-core-002",
        "REQ-core-004",
        "REQ-core-357"
      ],
