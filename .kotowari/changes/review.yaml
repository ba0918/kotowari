    reason: >-
      現在状態方針と関連 IR へ全差分を照合し、固定記録の置換と過去 snapshot の再検証、別 base の無効化、変更内容・IR の鮮度、旧 state の拒否を既存31テストで確認した。独立
      CLI で名指しした隠し配下の検査と未指定隠し配下の除外を観測し、release40ケースで記録更新・削除と候補前 abort の index・作業ツリー保持を確認した。差分再レビューでは旧
      archive 指示と未契約診断文の固定が除去され、既存31テストが通ることを確認した。判断の意味変更と役の独立性は機械の存在・鮮度検査では証明せず、この独立照合と再照合手順で確認する。
