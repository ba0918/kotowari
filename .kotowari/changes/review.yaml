      "reason": "Compared 723259b: original_item_line now finds line ends at CR or LF, and slice_at joins CRLF and lone CR as one LF, as split_lines does. slice_at also feeds statement text (document.rs blocks_from_node), so paragraph-reading statements lose \\r too; REQ-schema-063 covers statements and says the rule does not depend on the reading mode, and line reading never carried \\r, so this stays inside the rule. The test a_crlf_document_gives_the_same_values_as_the_lf_document compares LF and CRLF values for statement, field and bullet in both readings; before, paragraph reading kept \\r\\n between lines. Ran it: passes.",
