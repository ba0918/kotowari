      "reason": "Verified host_allowed accepts only 127.0.0.1:<port> and localhost:<port> (ASCII-lowercased, so name case is ignored; header name matched case-insensitively), rejects a missing Host, and respond returns an empty 403 before resolve touches the filesystem with no output. Port suffix, trailing dot, other IPv6 forms and extra text all fail the exact match, closing DNS rebinding for a 127.0.0.1-only server. English and Japanese REQ-core-356 and EX-core-543 agree with each other, with A1/A2 and with the code. The test covers all five EX hosts, checks empty bodies and silent stdout, and would fail without the change (200 instead of 403). Serve tests, check and changes pass.",
