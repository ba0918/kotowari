      "reason": "Checked the YAML-error line change against REQ-core-282 as revised by A10 and EX-core-511. When a part's YAML cannot be read and the reader reports a location, the finding line is the fence line plus the reported content line, which is correct because content starts on the line after the fence; without a location it stays the fence line, and detail stays the kind plus (yaml), with schema mismatches unchanged. The new process-level test reproduces the example (fence on line 10, error on line 13, detail cards (yaml)) and asserts only the finding. The findings reference and both user guides state the same line rule, matching the changed IR text and staying inside A10. The full workspace tests and the project check pass.",
