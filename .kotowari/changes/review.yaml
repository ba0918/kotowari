      "reason": "Compared 8325832: Schema::parse now runs check_placement_path on value and on every of key after path. TBL-schema-009 (cli.md) counts value and the of keys as paths of the same placement and makes an empty dot-separated name a stop; REQ-schema-036 says no separated name is empty. value \"\" splits to one empty name, so it is rejected too. The test an_empty_name_in_the_value_or_an_of_key_of_an_element_object_is_schema_invalid keeps a valid extract passing and rejects \"\", \"a..b\" and \".k\"; without the added loop those schemas parsed, so it would fail. Ran it: passes. Only the CHANGELOG Fixed line is added besides.",
