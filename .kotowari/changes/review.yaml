      "conclusion": "existing",
      "reason": "I independently judge the branch-wide comparison from 4bb9e6e5421ce06858d6ec05dd2792b6fe2df369 (merge-base with origin/main) to 9ac10b60f409fee06231ba41743ec22dc41073dc against the approved public-crate API, whole-picture and overview-placement requirements. The implementer record supplies the comparison scope only. I recomputed all 231 mode-plus-NUL/blob identities and every IR hash from the repository; they equal the implementer's, and this record's 72 IR documents are a superset of the implementer's 34. I added docs/ir/core/output.md, whose TBL-core-005 gained the \"overview\" key that REQ-core-288 implements; the implementer IR list omits it.\n\nPublic-crate split. 135 changed files are byte-identical, before and after, to the 878b42f independent review over b22c1ba; I reuse its grounds for them: validated schema extraction and read-only results, shared admission and retained originals in core, BASE-preserving native acquisition (A13, A14), the async adapters, the seven-package dependency direction, the A15 all-feature mutation lane and the three A16 bounded equivalents. That review's caveats about historical sealed runs and pending probes belong to its own head and are not carried over as evidence here. Moving the base to 4bb9e6e shifts no before identity of those files. The merge 191360f resolved conflicts in lefthook.yml and scripts/mutants.sh; I read the remerge diff: both keep main's changes (mutants removed from pre-push, GIT_ variables unset, the JOBS/SERVICE runner) and add the branch's --workspace --all-features and the -p kotowari-cli check invocation. Nothing from either side is lost. The other 38 changed files and 58 new files are judged below as overview work.\n\nOverview. The decision records 2026-10-02-whole-picture and 2026-10-04-overview-on-public-api A1 to A12 place calculation in kotowari-overview (no file, network or environment access), file reading and cache writing in the kotowari library, and serve in kotowari-cli. Core gains only a named finding group, and kotowari-markdown-view depends on no workspace package. The manifests match TBL-core-040 and A4 (view on the markdown-schema version series, overview on the kotowari series, ctrlc and tiny_http only in the CLI). I spot-checked the central code against the IR:\n- OverviewPrepared::write first walks .kotowari, .kotowari/cache and .kotowari/cache/overview with symlink_metadata. It stops with cache error and the path, writing nothing, when one of them is a link or exists as a non-directory. Create, write and delete failures map to cache error with the path and OS text, as REQ-core-324, REQ-core-296 and A9 require. Page links are removed before writing, and existing files are walked without following links. Only changed bytes are written and stale files are removed (REQ-core-293).\n- serve runs prepare (check and render), then binds 127.0.0.1 without retrying another port, then writes, matching REQ-core-297, REQ-core-298 and A7. Request paths are percent-decoded, restricted to normal components, canonicalised and required to stay under the canonical cache, and must be regular files (REQ-core-299).\n- The view draws the lead, then the preamble parts in order, then the sections (REQ-view-001, REQ-view-006, A10). HTML comments are replaced by a one-line private-use sentinel before parsing and the escaped sentinel is removed after rendering. Comments are therefore neither shown nor allowed to change block structure, and raw HTML stays text (REQ-view-007).\n- Every frontmatter violation yields the detail \"frontmatter\". A valid ir list is still returned alongside other violations, so REQ-core-284 still runs (TBL-core-038, A11).\n- check and status read overview data and pass an \"overview\" group through core. The new status line and JSON key sit between guides and surface, as TBL-core-005 and TBL-core-028 now state (REQ-core-288 to REQ-core-290).\n\nRequirement-marked test changes. Changed expectations only insert the overview group line or key into status and check outputs, and change the command count from seven to eight, consistent with REQ-core-001 and A12. The REQ-core-127 test moved from tests/step7_skill_references.rs to src/cli/tests.rs. It now compares the reference against the union of core, library and CLI stop wordings, which is a stronger form of the same expectation. Commit 1bc652a, after the cycle's last reviewed head 569bd5e, only drops a frame-extracting helper so the comment tests compare whole pages. That keeps the oracle and removes dependence on markup the IR does not declare. I found no deleted assertion that weakens a requirement.\n\nGaps. The cycle's three missing_spec findings were closed by person-decided corrections and IR before this head: the unusable cache place (A9, REQ-core-324), the frontmatter detail (A11, TBL-core-038) and the preamble parts (A10, REQ-view-001 and REQ-view-006). Each was fixed in the implementation (2833944, ce3ec76, 23ed619, ef847fe). A5 to A8 and A12 are LLM-derived details inside the delegated planning scope that change no approved requirement. Open record_only items are not specification gaps:\n- Item 10: the reference table is keyed by the reference string, so per-occurrence entries of equal strings would be identical and nothing observable differs from REQ-core-291.\n- Item 20: a listing failure under the cache is a read and stops with the existing unreadable-file reason.\n- Items 11 to 17 and 19 are informational.\n\nEvidence I ran at this head: cargo test --workspace --all-features passed 1543 tests with 0 failures; kotowari check exited 0 with only notices; kotowari changes --phase implementation covered 231 of 231 files with no findings. I did not build package archives (scripts/check-packages.py), run mutation tests, exercise a real Ctrl-C on serve, or confirm that the person saw the LLM-decided A5 to A8 and A12. Those remain for the integration gates. The existing conclusion means the reviewed changes implement approved requirements and grounded delegated choices with no unresolved gap. It is not release authorization.\n",
