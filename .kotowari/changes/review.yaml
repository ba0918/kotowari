      "conclusion": "new",
      "reason": "Reviewed the new ci.yml and the hardened workflows against main. actionlint reports nothing, shellcheck is clean on the new scripts, and zizmor reports only the three low self-repository hints accepted in A9. rustup 1.28+ installs the active toolchain from rust-toolchain.toml when toolchain install has no argument (confirmed locally with rustup 1.29.1 help and behavior). The extracted scripts were compared with the inline steps they replaced: release-meta.sh prints the same six keys and the same ::error:: line and exits 1 on a bad tag, which fails the tee step because defaults.run.shell bash adds pipefail (exercised under bash -eo pipefail); release-notes.sh keeps the same awk extraction and errors; package-release.sh keeps the same packaging; mutants-shard.sh keeps the same dispatch (an unknown scope now exits 2 instead of 1, still a failure). The mutants nightly (1.101.0-nightly) satisfies rust-version 1.99. The required check job name mutants in mutants.yml is unchanged, permissions stay read-only except the commented release, issues and pages grants, and the release concurrency group does not cancel (A5-A7, A9).",
