      "conclusion": "existing",
      "reason": "kotowari-core gains the sha1 crate (0.10, the RustCrypto line of the sha2 0.10 already used) for the git blob hash of REQ-core-340, and a translations module that decides everything from in-memory names and texts: classify reads a file name as the first-language side, another language's side (the tag before the extension is a non-first language in the list) or a <stem>.i18n.yaml record that is no side (REQ-core-337, A31, A39); side and record paths are derived in the same directory; Pairs dedupes by first-language path so a pair read from two places reports once. Pair findings follow REQ-core-338 (translation_missing per missing side on the first side, or on an orphan side whose first side is missing, which no other check then reads), REQ-core-339 (translation_record_invalid with missing, yaml, keys or value in that order; a record that is not UTF-8 cannot be read as YAML and reports yaml) and REQ-core-341 (translation_stale per side with the recorded and current hashes, not raised while the record is invalid), all with a null line (REQ-core-027, TBL-core-019). The skeleton module compares the TBL-core-044 parts per document kind in table order and reports the first mismatching part with the other side's line of the first differing element, null for a count difference or an absent element; overview part values drop the TBL-core-045 sentence fields while keeping keys and list lengths; table-of-contents elements take their lines from the YAML reader's spans (REQ-core-344, REQ-core-345). IR and guide sides need the switcher line of REQ-core-346 built from each language's language_name; only an exactly equal line is the switcher, and it is blanked before the IR parse, the skeleton and the link scan so it is neither scope nor checked text, while missing_scope still fires when it is the only scope line. Links, images and reference definitions are read with the markdown crate's mdast and its positions (no regular expression); destinations without a scheme or # are resolved from the side's directory without # and ? and reported as link_language_mismatch or link_to_record on their line (REQ-core-347 to REQ-core-349); the guide and overview link parts compare destinations read as the first-language side. The kotowari library (crates/kotowari/src/translations.rs) finds the sides and records by name beside each first-language side found by the existing collectors, whether or not a glob matches them (REQ-core-337), reads raw bytes for the hash and the BOM-stripped text, and keeps only first-language IR sides for the IR reader; with two or more languages a *.i18n.yaml file is not a side and is therefore not read as a guide either, and every guide side is read as a guide (REQ-core-343). Core runs only the REQ-core-342 checks on other IR sides, parsed with the first side's document kind: terms against the CONTEXT.<tag>.md chain, vague words from the one vague_words list, document-name references, unclosed backticks, and the glossary-form kinds glossary_invalid, invalid_glossary_row, glossary_title_invalid and duplicate_term; files and lines of check and status count every side, and items, IDs, sources, fingerprints, list and query come from the first side only. kotowari-overview checks the form, parts, lead, references and guide marks of every overview side and the form of every table-of-contents side, but ir entries, name conflicts and the table-of-contents comparison only on the first side (REQ-core-305, REQ-core-328, REQ-core-329); its group's files counts every side read, which no requirement fixes. list with two or more languages also walks the guide, overview and table-of-contents places with check's stop rules and prints translations in JSON and as one text line per pair (REQ-core-152, REQ-core-155); with one language the top level stays items only. overview build and serve render one input per language from that language's sides with its tag, UI text and the other languages in list order (root to tag/, tag to ../, tag to ../other/), take IR bodies from that language's sides and leave record, ADR and other Markdown references without a body on other languages' pages, write other languages under <tag>/ (a <tag> entry that is a symbolic link or not a directory is a cache error, as REQ-core-324 treats the place itself), and stop without writing on translation_missing or translation_structure_mismatch of IR, overview data or table-of-contents pairs (REQ-core-353 to REQ-core-355, REQ-core-291, REQ-core-293, REQ-core-294). The layering of REQ-core-307 and REQ-core-308 is kept: core decides, the library reads files, the CLI only formats. Every scenario EX-core-512 to EX-core-542 has a process test in tests/step21_translations.rs or tests/step10_list.rs and was seen failing before its code; core tests in crates/kotowari-core/tests/translations.rs cover REQ-core-340, every TBL-core-044 part, the link parts, the switcher exclusion and the lines of the new kinds. The overview crate's existing tests only adapt to optional reference bodies. With no languages key this repository's kotowari check reports no new kind. Later fixes in the same comparison stay inside these requirements: decision records under decisions.records and decisions.adr are never paired even when a guides.files glob covers them and are read only as guides (REQ-core-336, EX-core-517, process test req_core_336_a_guide_glob_over_the_record_places_does_not_pair_the_records); overview build and serve collect guide pairs as check does, so a link from an overview data side to the matching guide side is read as the first-language side and does not stop the build (REQ-core-294, TBL-core-044, process test req_core_294_overview_links_to_the_matching_guide_sides_do_not_stop_the_build); the skeleton's table rows split on | only when it is not escaped by a backslash, as GFM reads a table, so an escaped \\| inside a cell does not shift the columns (TBL-core-044, core tests on glossary and guide tables); every <tag>/ place is checked before the first page is written, so a symbolic link or non-directory there stops with a cache error having written nothing (REQ-core-353, REQ-core-324); and the REQ-core-352 core test gives a complete labels.ja so each broken en label stops for its own error, and a correct form is seen to pass.",
