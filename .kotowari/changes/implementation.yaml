      "conclusion": "existing",
      "reason": "RenderInput gains the language tag, the UI text (a map from TBL-view-002 keys to strings) and the other languages (a name and a relative place each), and a reference's body becomes optional (REQ-view-001). The view now writes every word of its own from the UI text: the index link, the page and count badges with {n} replaced by the decimal number (REQ-view-016, REQ-view-017, REQ-view-019, REQ-view-028), the stale mark and the outline mark (REQ-view-009, REQ-view-022), the superseded and deferred marks (REQ-view-008), the compare column headings and the status labels, whose states are now decided, planned, open and dropped in crates/kotowari-markdown-view/schemas/status.json and the counted states (TBL-view-001); an unknown state shows its own text from the document. The crumb separator, which no TBL-view-002 key covers, is drawn by the shared style sheet so no page text comes from a literal in the view (REQ-view-027). html carries lang from the input (REQ-view-026); every HTML page lists links to the same page in each other language, place followed by the page name, in input order, none when the list is empty, with no script (REQ-view-029, REQ-view-018); a reference without a body is drawn as its label and marks without an element that opens (REQ-view-030). New tests in crates/kotowari-markdown-view/tests/languages.rs cover EX-view-018 to EX-view-023 and TBL-view-002 by the lang attribute, link targets and texts and the page text, not by surrounding markup; they failed to compile before the change. The existing view tests pass the Japanese UI text their scenarios now give through tests/common/ui.rs (EX-view-011, EX-view-012, EX-view-015) and English state words in their inputs; the determinism property also draws references without a body. README and the example describe and pass the new inputs.",
