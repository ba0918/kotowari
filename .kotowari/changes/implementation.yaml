      "conclusion": "existing",
      "reason": "The branch removes the unused warnings of the non-test build without changing behavior. MapContext in crates/kotowari-core/src/finding_map.rs (a private module) no longer keeps the extracted title, because no mapping rule of the finding map table reads it (REQ-core-171); titles in findings still come from the raw line, as in multiple_titles. In crates/kotowari/src/ir.rs the imports of kotowari_core::ir and Finding are limited to test builds, because only load_and_check and load_and_check_with_duplicates, themselves cfg(test) helpers for the IR reading tests (REQ-core-033), use them. StopReason::WORDINGS in src/cli.rs is limited to test builds, because its only reader is req_127_findings_reference_stop_wordings_match_the_code (REQ-core-127); Display still prints PORT_ERROR directly. Both modules are private, so no public API changes. cargo build --workspace reports no warning, and the whole workspace test suite passes.\nThe branch also removes the unused warnings of the test builds: helper functions and a constant that no test calls any more (findings_on_line, find_kind_in_json, topic_with_requirement and kinds_on in crates/kotowari-core/tests/ir.rs, with_ir in crates/kotowari-core/tests/change_records.rs, invalids in crates/kotowari/tests/change_records.rs, default_config, check and find_by_kind in tests/step2_ir.rs, args in tests/step14_plan.rs, surface in tests/step17_surface.rs, SURFACE_RS in crates/kotowari-source-analysis/tests/surface.rs) and the imports that only they used or that nothing used. No test function and no requirement mark is removed or changed, so what the tests verify is unchanged; cargo test --workspace --all-features builds without a warning and passes.",
      "requirements": [
        "REQ-core-033",
        "REQ-core-127",
        "REQ-core-171"
      ],
