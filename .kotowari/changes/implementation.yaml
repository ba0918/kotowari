      "conclusion": "existing",
      "reason": "crates/kotowari-core/src/config.rs reads the top-level keys languages (a list of tags) and labels (a map from a tag to a map from UI text keys to strings), keeps them through Config::validated, and stops with a config error on an empty tag, a tag with a character other than a lowercase letter, digit or -, or a repeated tag (REQ-core-335). Config::languages returns the language list, en alone when the key is absent or empty (REQ-core-334, TBL-core-004, the glossary term 言語の一覧). crates/kotowari-core/src/ui_text.rs holds the seventeen keys of TBL-core-046 with whether each is counted and its English text; Config::ui_text resolves en as that table overwritten by labels.en and any other language as labels.<tag> itself (REQ-core-351), and labels stops with a config error on a tag not in the language list, a key not in TBL-core-046, a non-en language without labels or missing a key, or a counted value without exactly one {n} (REQ-core-352). The detail wording is not declared and is not pinned by any test. Process tests in tests/step1_config.rs (EX-core-513, EX-core-537, EX-core-538, EX-core-539) first run the corrected configuration and see exit 0, then the broken one and see exit 2 with a config error; they failed before the change because both keys were unknown. Core tests in crates/kotowari-core/tests/translations.rs (REQ-core-351 with TBL-core-046, REQ-core-334, REQ-core-335, REQ-core-352) are listed with the pair entry, which owns that file.",
      "requirements": [
        "REQ-core-334",
        "REQ-core-335",
        "REQ-core-351",
        "REQ-core-352"
      ],
