      "conclusion": "existing",
      "reason": "The branch implements the approved overview-index specification (2026-10-05-overview-index.md A1 to A36 and D1) inside its requirements, without changing the IR or the decision records. kotowari-markdown-view takes the table of contents as the third part of the render input (REQ-view-001) and, without checking it (REQ-view-003, REQ-view-021), draws the index with the outermost title and note as the heading, nested groups as open details elements that fold without a script (REQ-view-005, REQ-view-018), each document card with its title, lead conclusion and the non-zero counts of stale sections and of 未決 and 予定 labels from the preamble and section status parts (REQ-view-016), and each group heading, the outermost included, with its descendant page count (a nested group's note is drawn inside its summary so that it stays visible when the group is folded, REQ-view-005, REQ-view-018) and the non-zero totals of stale sections and 未決 (REQ-view-017). Names without a document are skipped and not counted, documents not in the contents keep their page without an index entry, and repeated names are drawn and counted each time. Each document page shows above its title the groups leading to the first depth-first occurrence of its name, linked to their places in the index, or only a link to the index when it is not in the contents (REQ-view-019); the first occurrence of each name is found by one depth-first walk per render instead of one walk per page, with the same result, and after its last section links, by title, to the other documents named directly in the same group in written order (REQ-view-020). The markup, the position-based anchors (toc, toc-0, toc-0-1) and the style are the implementer choices that the plan and D1 leave open. kotowari-core gains only the required overview.toc path key, checked for null and absolute values like other paths (REQ-core-013, REQ-core-014, TBL-core-004), and the five overview_toc_* finding kinds, which the skill findings reference lists (REQ-core-125, TBL-core-008). kotowari-overview checks the contents text against an embedded JSON Schema with the same place notation as overview_part_invalid (REQ-core-327, TBL-core-043); the schema uses if/then/else instead of anyOf for items so that a nested violation reports its own place. Only a well-formed contents is compared with the overview data names: missing pages, unknown names on every occurrence, repeated names from the second depth-first occurrence and empty groups, with (root) for the outermost (REQ-core-328 to REQ-core-331); all have the contents file as path and a null line (REQ-core-027), and the contents is passed to the view as written (REQ-core-332). The kotowari library reads the file overview.toc names in check, status, build and serve after the existing overlap checks, stopping with a config error when the file is one of the files the overview, guides or tests walks read, and as an unreadable or non-UTF-8 file like overview data (REQ-core-325, REQ-core-326, TBL-core-001); contents errors stop build and serve before writing or binding (REQ-core-294). With the guides and tests overlap judged first and the overview data overlap judged before it, a contents file matched by two of the walks always stops at an earlier check, so the key order of REQ-core-326 is implemented but only the single-key cases are observable. Existing tests that enable overview gained a contents file listing their data names; the EX-core-476 test now expects a.html to be rewritten as well, because its group link to the removed page disappears (REQ-view-020); the REQ-core-324 test moves the data and contents out of the linked .kotowari because the data walk does not enter a linked hidden directory; the sync and async comparison removes one of two pages instead of the only one, since an empty contents is an error. The brainstorm skill revises the contents after the overview data at approval, and the overview reference documents the key, the form, the stops, the findings and placement by the LLM without asking, splitting a group only once it grows and ordering each level for the reader (REQ-core-300, REQ-core-333, verified by review). The tests of the index and group links compare each link by its target and visible text, not by its markup, because the specification fixes only those. The overview reference also states that an empty items list is well-formed and reported as overview_toc_group_empty (REQ-core-330), and the user guides (docs/guides) document the overview.toc key, its config errors, the five overview_toc_* kinds, the null line and the stops, with their section marks refreshed to the current IR. The rule that the same detail is reported once (TBL-core-043) is kept in toc.rs, but no test pins it: a probe of 300,000 random contents through the validator and the place notation found no input that yields two errors at the same place (0 duplicates among 112,345 multi-error inputs), because a type error, an unknown key and a missing key never coincide on one value and key names are escaped with ~0 and ~1, so a test claiming to cover it was removed. Mutation tests over crates/kotowari-overview/src/toc.rs ran locally (scripts/mutants.sh full -- -f crates/kotowari-overview/src/toc.rs): 8 mutants, 7 caught, 1 unviable, none survived, including delete ! in form on the dedup line; the pull request CI runs them over the whole diff.",
