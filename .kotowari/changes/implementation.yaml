      "reason": "The Host restriction is HTTP serving boundary policy and remains in the CLI adapter. A1/A2 and REQ-core-356 require only 127.0.0.1:<served-port> and localhost:<served-port>, ignoring ASCII name case; all other or missing Host values receive an empty 403 before filesystem resolution with no per-request output. respond delegates the pure exact-value comparison to host_allowed before resolve. EX-core-543 tests both accepted names, an external name, the wrong port and missing Host, the returned bodies and silent stdout. Existing serve requests now carry the served port in Host. The comparison against the integrated main retains these implementation and test bytes unchanged; PR19 changes only the distributed skill policy and does not alter the product requirement or serving boundary.",
