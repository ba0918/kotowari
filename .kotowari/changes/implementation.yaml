      "conclusion": "existing",
      "reason": "The seven-package restructuring implements the approved synchronous and optional Tokio contracts while retaining existing CLI assertions, schema algorithms and configuration meaning. Core derives documents and read-only results from acquired text and analysis facts rather than accepting unchecked internal documents and independently supplied results. Schema construction and document data are protected; CLI-owned conversion maintains existing JSON contracts. The partial IR parser retains nameless items with their original heading diagnostics, while CLI filtering remains unchanged. Native acquisition spellings, hidden-directory exclusions, dot-file discovery, filename ordering and diagnostic display paths preserve established behavior. Canonical schema bytes and the two user-authorized verification-reference corrections are retained. Source-level default/Tokio/CLI tests, hidden-item API inspection and external consumers verify the additional corrections. Prior shipped-archive and mutation observations apply only to their recorded earlier heads; final sealed-candidate package and mutation gates remain required and deferred pending parent-owned review. This implementer record does not claim independent review or integration readiness.",
