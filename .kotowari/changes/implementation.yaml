      "conclusion": "existing",
      "reason": "crates/kotowari-markdown-view/src/lib.rs draws, on a document page that has at least one section, an outline (a nav element with a list) after the title and before the lead, the order REQ-view-006 now states as revised by A19: one item per section in the order of the sections, its text the heading text, linking to the section on the same page, and a short mark (見直していない) after the link of a stale section that means the same as the REQ-view-009 mark next to its heading (REQ-view-022, A5, A14, A17). The outline holds no item for the lead or preamble, no deeper heading and no link to another page; a document without sections and the index page get none. Each section gains the id section-<index>, its zero-based position in the section list, so two sections with the same heading get different places and the same render input gives the same ids (D1, REQ-view-004). crates/kotowari-markdown-view/src/style.css keeps the outline in a left column with position sticky from 1100px up and leaves it under the title, not following the scroll, below that (REQ-view-023, D2); it draws each flow column as one enclosure with the arrow only between columns and, below 720px, stacks the columns with a downward arrow (REQ-view-024, REQ-view-025, D2). No script is added to any page (REQ-view-018). New tests ex_view_016 and ex_view_017 in crates/kotowari-markdown-view/tests/navigation.rs verify REQ-view-022, EX-view-016 and EX-view-017 by link targets and visible text; they find the outline by its in-page links (links whose target is a place on the same page), through new helpers in crates/kotowari-markdown-view/tests/common/mod.rs, not by its markup. Three tests in tests/rendering.rs (REQ-view-006, EX-view-005) and one in crates/kotowari-overview/tests/overview.rs (REQ-view-006) located a heading by its first occurrence, which is now in the outline; they now check the order on the rendered page itself: the title, then the outline (found by its in-page links), then the lead, the preamble parts and the sections reached through those links (REQ-view-006 as revised by A19), and EX-view-005 compares the pages from the first section on, so the heading mark still changes only between the two section headings. REQ-view-023, REQ-view-024 and REQ-view-025 are review requirements checked on rendered pages; the whole workspace test suite passes.",
