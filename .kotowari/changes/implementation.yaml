      "reason": "配布スキルの文言だけを変える。kotowari スキルに What the IR holds を足して IR に書くものを製品の利用者が観測できる振る舞いに限り、CI・フック・リリース・ビルド設定・リポジトリ自身のデータ・プロジェクト自身のテストと検査を IR の外と列挙した（A1、A2、A3）。壁打ち、計画、実装、cycle、review、iterate と変更照合の reference はその定義を参照する（A4、A5）。この決まりは IR に書かない（A5）ので IR は変えない。CHANGELOG の Unreleased に利用者向けの変更を足した。",
