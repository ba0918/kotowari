    {
      "id": "current-records",
      "role": "implementer",
      "conclusion": "new",
      "reason": "採用済み現在状態方針に合わせて state を廃止し全件参照を検査する。明示された隠し記録のみを静的検査し、固定現在ファイルと探索 ignore・無効時の独立再照合へ運用を揃える。旧形式は当時のツール版で再検証する。release の記録更新・削除許可と保持は追加委譲の同じ境界で接続する。",
