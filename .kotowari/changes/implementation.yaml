      "conclusion": "new",
      "reason": "overview serve listened only on 127.0.0.1 but did not check the Host header, so a site that rebinds its own name to 127.0.0.1 could read the overview pages through the browser. The new decision (A1, A2) and REQ-core-356 with EX-core-543 on both sides of the overview-commands pair say serve answers only Host values 127.0.0.1:<port> and localhost:<port> for the served port, letter case of the name ignored, and returns 403 with an empty body before looking up the path otherwise, including when Host is missing. respond now checks the header with host_allowed before resolve. The new integration test sends the five Host variants of EX-core-543 and failed before the change (200 instead of 403); the test client now sends a Host header with the port. The whole workspace suite passes.",
      "requirements": [
        "REQ-core-356"
      ],
      "decisions": [
        "docs/decision/records/2026-10-05-serve-host.md#A1",
        "docs/decision/records/2026-10-05-serve-host.md#A2"
      ],
      "handoff": null,
      "gaps": []
    },
