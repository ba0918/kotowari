      "conclusion": "existing",
      "reason": "The branch removes the unused warnings of the non-test build without changing behavior. MapContext in crates/kotowari-core/src/finding_map.rs (a private module) no longer keeps the extracted title, because no mapping rule of the finding map table reads it (REQ-core-171); titles in findings still come from the raw line, as in multiple_titles. In crates/kotowari/src/ir.rs the imports of kotowari_core::ir and Finding are limited to test builds, because only load_and_check and load_and_check_with_duplicates, themselves cfg(test) helpers for the IR reading tests (REQ-core-033), use them. StopReason::WORDINGS in src/cli.rs is limited to test builds, because its only reader is req_127_findings_reference_stop_wordings_match_the_code (REQ-core-127); Display still prints PORT_ERROR directly. Both modules are private, so no public API changes. cargo build --workspace reports no warning, and the whole workspace test suite passes.",
