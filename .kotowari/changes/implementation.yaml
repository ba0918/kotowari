      "conclusion": "new",
      "reason": "変異テストを pre-push から外し、PR（マージ基準からの差分）とリリース（同じ製品の1つ前のタグからの差分、無ければ全体）の GitHub Actions で8分割して回す。見逃しの判定は従来どおり scripts/mutants.sh が kotowari mutants に読ませて行い、等価の一覧と mutants::skip の検査、設定を読まない実行は変えない。手元の既定の同時実行数は測定の結果1のまま。関門の設定は IR に書かない決まり（A8）なので IR は変えない。 pre-push のテストの前に GIT_ で始まる環境変数を外す。worktree からの push で git がフックに渡す GIT_DIR がテストに引き継がれ、本物のリポジトリを書き換えたため（使い捨てのリポジトリを GIT_DIR に指して再現し、外すと書き換わらないことを確かめた）。",
