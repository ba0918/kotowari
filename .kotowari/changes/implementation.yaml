      "conclusion": "existing",
      "reason": "The seven-package restructuring implements the approved synchronous and optional Tokio contracts while retaining both CLI contracts. Core admits configuration and enabled groups, retains original source identity and text, and computes read and check results through shared private phases. Logical SourceText remains canonical; native acquisition carries lossless PathBuf provenance separately from producer display/rule spellings, preserving the BASE-supported display collisions, counts and matching. Opaque preparation parses each IR file before later acquisition and checks guide overlap after enumeration but before guide bodies and surface acquisition. Public changes inspection validates consumed configuration while fact-only evaluation stays independent. Results remain read-only, CLI conversion remains CLI-owned, and useful facade aliases retain lower-type identity. List/query member order is restored without changing values, nulls or arrays. Canonical version fixtures retain intentional mismatches, transformations and real production rollback; inherited change-record diagnostic assertions are unchanged. The previously authorized two schema verification references and newly authorized three acquisition verification references preserve requirement meaning. The linked stop guide was reviewed and only its related fingerprint refreshed. Chronological repair RED, GREEN and REFACTOR evidence, current workspace/CLI/source-consumer checks and exact baseline differences are retained separately. The earlier broader constructor TDD deviation is not relabeled. Final sealed-head shipped-artifact and full mutation gates remain deferred pending parent-owned review; historical archives and raw mutation misses do not prove this candidate. This implementer record does not claim independent approval or integration readiness. Legacy collected-file acquisition preserves the BASE lossy absolute read selection and ordering for tests, guides, surfaces and change records while retaining distinct lossless enumeration identities. Original IR and decision-source PathBuf reads remain unchanged. Text consistency compares actually acquired source by enumeration identity, without inode discovery, merging legacy read aliases or weakening public admission. The byte-filename-only stop and byte-name-plus-replacement multiplicity are covered by chronological producer-grounded regressions, and the approved backslash collision remains an exact BASE output match. Planning A14 records this preservation adjudication without any further IR edit. The user-authorized mutation repair enables all features only in the mutation lane and preserves ordinary default tests and the existing selection, resource, checksum and policy gates. Producer-grounded public-observation assertions cover retained IR/native paths, references, preparation configuration, required guides and acquired-analysis text, public surface evaluation, schema open/relax extraction, loaded document content, reachable error Display and facade error classification. No original product defect was established or production Rust edited; passing original-code tests and bounded mutant sensitivity are not relabeled as test-first RED. Only the three independently challenged ParseError substitutions are registered under A16's locked producer/serialization proof and explicit manual invalidation conditions, without implying automatic dependency staleness or independent approval of these new entries. The failed 680-outcome sealed mutation run is historical evidence, not a pass or replaced by probes. Parent-owned reviewer grounds remain untouched and stale; final shipped-artifact/full mutation awaits independent review and a new seal. On top of that restructuring, the branch implements the approved overview specification inside its requirements and the 2026-10-04 placement decisions: kotowari-markdown-view renders the render input into pages and publishes the eight part schemas without touching files; kotowari-overview checks overview data from texts and an already read ReadModel and builds the reference table, stale sections and render input; core gains only the overview finding kinds, the overview.files key, a generic named finding group, guide-mark reading of one text, and read-only access to read documents and source targets; the kotowari library reads overview data, checks overlaps and passes the overview group, and offers overview_prepare and overview_build writing only under .kotowari/cache/overview; kotowari-cli adds overview build and serve (tiny_http, ctrlc). Later fixes follow decisions A9 to A12 of the 2026-10-04 record and REQ-core-324: build and serve stop with cache error and write nothing when .kotowari, .kotowari/cache or .kotowari/cache/overview is a symbolic link or not a directory; parts after the lead and before the first section are drawn after the lead; every frontmatter violation has the detail \"frontmatter\" while a valid ir list is still matched against the IR; HTML comments in Markdown text are replaced by a sentinel before parsing and the sentinel is removed after rendering, so comments neither show nor change the block structure. Guides and the public crate guides follow the overview commands and the nine packages. Following A13 and A14, the four status badges are drawn so that they can be told apart, serve stops with port error when accepting a connection fails while serving, and serve returns files in the cache whose names contain a backslash. Following 2026-10-04-mutants-in-ci.md A9 to A12, the pull request mutation tests run on the diff from the last commit that passed, with a 20-second test timeout, inside a memory-limited systemd scope, split into 16 shards with a prebuilt cargo-mutants. Skill texts add the approval steps and the overview reference. Every behaviour is covered by marked tests or the review requirements REQ-core-287, REQ-core-300 to REQ-core-303, REQ-core-306 and REQ-core-307.",
