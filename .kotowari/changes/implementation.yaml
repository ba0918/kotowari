      "conclusion": "new",
      "reason": "Only the wording of the distributed skills changes. The kotowari skill gains the section What the IR holds, which limits the IR to behavior a user of the product can observe and lists what stays outside it: CI and workflows, hooks and their gates, release and build configuration, the repository's own data, and rules about the project's own tests and checks (A1, A2, A3). Tests of product behavior still carry the marks of their requirements, and IR approved earlier stays until the person decides (A7, approved by the person on 2026-10-05). The brainstorm, plan, implement, cycle, review and iterate skills and the change-conformance reference point at that definition, and changes only to CI, hooks, release or build configuration are reconciled as new with empty ir and requirements (A4, A5). The section sits after Scope so that the version check stays under Scope. The rule itself is not IR (A5), so no IR changes. The Unreleased section of CHANGELOG tells users about it.",
