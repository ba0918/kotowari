          "path": "docs/ir/core/translation-pairs.md",
          "sha256": "sha256:65586c68c5f7c1438e688031996cd542e4da0de959cd698a44de7b142aa737ad"
        }
      ],
      "conclusion": "existing",
      "reason": "kotowari changes read every .md under the IR place, including other-language sides such as foo.ja.md, and mapped each requirement to whichever side sorted first, so a change record listing the first-language side failed changes while one listing the other side failed check. REQ-core-342 says the items of an IR pair are read from the first-language side only; changes now skips other-language sides when it reads requirements and IR paths, using the same side classification as check (REQ-core-337). The new test builds a snapshot with languages [en, fr], a pair a.md / a.fr.md and a record naming only a.md, and fails without the fix with missing definition IR docs/ir/a.fr.md. The whole workspace test suite passes.",
      "requirements": [
        "REQ-core-342"
      ],
      "decisions": [
        "docs/decision/records/2026-10-05-localization.md#A22"
      ],
      "handoff": null,
      "gaps": []
    },
