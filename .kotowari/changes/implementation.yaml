      "conclusion": "existing",
      "reason": "The check guide gains a section on committing a specification before its tests: the range of test-side findings from TBL-core-047, that only the exit code changes, and that the pre-commit hook runs check with --allow-test-findings while the pre-push hook and CI run it without, as REQ-core-358 requires; the kotowari skill's findings reference and kotowari-adopt say the same. The option rows, argument-error lists, exit-code tables and help output in cli.md and check.md follow the changed REQ-core-002, REQ-core-004 and TBL-core-002. Every other guide section whose mark went stale (list, mutants, plan, query, status, config, including REQ-core-014 and REQ-core-019 whose fingerprints changed with the glossary) was reread against kotowari query and still matched, so only its fingerprint was updated. Each pair's Japanese side carries the same change and its consistency record was copied from kotowari list. CHANGELOG has one Unreleased entry under Added. The routing row of the kotowari skill's check scene now also names putting kotowari check into hooks or CI, so an agent setting up hooks reaches the guidance in references/findings.md.",
