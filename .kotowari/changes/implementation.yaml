      "conclusion": "existing",
      "reason": "check now accepts --allow-test-findings, a flag without a value, and every other command stops on it with an argument error, as REQ-core-002 and REQ-core-004 now state; the rejection runs before the early return for changes, so changes and mutants reject it too. kotowari-core decides from TBL-core-047 whether an error is a test-side finding: the test files read during the check, and which of them match the globs of surface.files, are kept in the check result, unserialised, because an unparsable_file on a file in both sets is merged into one finding and the finding alone cannot tell where it came from. A surface file is any file matched by surface.files (the glossary), not only one in a surface rule's language, and the surface walk and exclusion follow tests.files, so matching the test file paths against those globs is enough; when surface.rules is empty, surface.files is empty too (REQ-core-225). With the flag the CLI computes the exit code from the errors that are not test-side findings and prints the same output, as REQ-core-357 and TBL-core-002 state. Real RED: the parse tests (Cli::Check had no allow_test_findings field), the TBL-core-047 core test (no method is_test_side_finding) and EX-core-547 (exit 1 instead of 0), and later the process test of an unparsable test file matched by surface.files in a language no surface rule covers (exit 0 instead of 1, because only the analysed surface files were counted). EX-core-548 to EX-core-552 and the REQ-core-357 output test already held when written, because the flag was an unknown option or had no effect yet; they pin that the stops and the output stay. The --help option lines share one description column wide enough for --allow-test-findings, and the guides' copies of the help output follow it. A process-level test runs check with the option on a project whose only errors are an unresolved_reference and an invalid_marker in one test file and an unparsable_file in another, and expects exit code 0 with those findings still in the output, so the paths of findings from real file acquisition are shown to meet the classification.",
      "requirements": [
        "REQ-core-002",
        "REQ-core-004",
        "REQ-core-357"
      ],
