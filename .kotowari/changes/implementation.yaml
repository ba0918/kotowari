      "conclusion": "existing",
      "reason": "The user guides describe languages and labels with the UI text keys and their English text (docs/guides/config.md), the pair layout and consistency record, the seven new finding kinds with their detail and line (docs/guides/findings.md, docs/guides/commands/check.md), translations in list JSON and text and list's walk of the guide and overview places with two or more languages (docs/guides/commands/list.md), and per-language overview pages and the build stop on missing sides and skeleton mismatches (docs/guides/cli.md); the guide marks on TBL-core-004, TBL-core-008, TBL-core-019, REQ-core-027, REQ-core-152 and REQ-core-155 are reread against the changed IR and carry the current fingerprints, and new sections carry marks for the requirements they describe, so check reports no guide_stale or invalid_marker. The kotowari skill gets the scene translate and references/translations.md with the procedure of REQ-core-350's how_to_verify: change every side of a pair in the same change, take the previous text from git by the recorded blob hash and translate only the difference, translate from the whole text when the hash cannot be taken, rewrite the consistency record from kotowari list's translations, and write labels.<tag> when adding a non-English language; references/config.md, findings.md (the seven Kind rows, which the REQ-core-125 test compares with the code) and overview.md (English status states, per-language pages) follow. CHANGELOG.md has one Unreleased entry under Added. This repository's own documents are not translated and its configuration gets no languages key (A13). The skill's references/config.md lists the seventeen UI text keys of TBL-core-046 with where each is used, its English text, the keys that take exactly one {n}, and the conditions that are config errors (REQ-core-351, REQ-core-352), and translations.md points at that list for writing labels.<tag>; references/findings.md, references/overview.md and docs/guides/cli.md describe the cache error for a language's .kotowari/cache/overview/<tag> place with two or more languages (REQ-core-353).",
