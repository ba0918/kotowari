      "reason": "Tests only, for the four scenarios that write down behaviour the specification had been silent on: EX-view-024 (a reference link resolves only within its own block), EX-schema-094 (a depth-3 heading in a document without a title is outside the declared preamble in the open world), EX-schema-093 (a cache whose directory cannot be created, and a cache file that cannot be written, do not stop the check and the fetched schema is used), and EX-core-545 (a hidden directory named only inside braces is not entered, with a record in the non-hidden alternative as the positive control). No product code changed; each test passes against the existing behaviour. REQ-schema-061 now scopes the before-title rule to schemas that declare no item directly under the document.",
