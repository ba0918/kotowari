      ],
      "conclusion": "existing",
      "reason": "The configuration now lists languages [en, ja] with every labels.ja key (localization A16, A40; REQ-core-334, REQ-core-351), so the guides are pairs (REQ-core-336, REQ-core-343): each English side keeps the file name without a suffix and the former Japanese text moved to the .ja.md side in the same directory (A15, REQ-core-337), and every side has a consistency record with both blob hashes copied from kotowari list (REQ-core-339, REQ-core-340). The English sides are translations: headings, guide marks, code blocks, table shapes and link destinations are identical on both sides (REQ-core-344), each side starts with the switcher line (A33, A36, REQ-core-346), and links on each side point at the same language. The sections that explained why the tool is built as it is were removed from both sides, because they consisted of links to decision records, which a paired document may not hold (A14, REQ-core-349), and a guide does not carry decision history (guide-overview-roles A3). Because the IR's items and fingerprints are now read from the English side, every guide mark's fingerprint was copied from kotowari list; the sections were translated, not changed in meaning, so no section fell behind its items (REQ-core-203, REQ-core-204). kotowari check reports no error and status is complete.",
