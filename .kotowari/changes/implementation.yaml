      "reason": "In line reading a list item whose content opens a fence (- ```python) is read as an item whose content is a code block, from the item's content column, as paragraph reading already does. Before, the indented closing fence was taken as a new opening fence and the rest of the document, later headings included, was swallowed. TBL-schema-011 makes a fenced block a code block in both readings whatever its indentation. Spec test was seen failing.",
