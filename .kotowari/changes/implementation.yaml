      "reason": "markdown-view no longer enables GFM footnotes. Rendering them inserted the markdown crate's English heading \"Footnotes\" and \"Back to content\", text not taken from the UI text (REQ-view-027), and REQ-view-007 reads CommonMark with GFM tables, not footnotes. The footnote syntax now reads as CommonMark. Spec test was seen failing. Only the footnote definition construct is turned off: without definitions \"[^1]\" never becomes a footnote call, so the call construct changed no output. The spec test now also pins that \"[^1]: 注\" is a CommonMark link reference definition and \"本文[^1]\" renders as <a href=\"%E6%B3%A8\">^1</a>; removing the definition setting fails it.",
