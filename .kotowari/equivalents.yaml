# 等価の一覧（docs/ir/core/equivalents.md の REQ-core-141、REQ-core-143）。
# 載せる前に、別の文脈でその変異を落とすテストを書けないか試している。
# why には、なぜ観測できないかと、何を試して落とせなかったかを書く。

- file: crates/kotowari-core/src/skeleton.rs
  change: "replace <impl serde::Deserialize<'de> for TocNode>::deserialize::<impl serde::de::Visitor<'de> for Visitor>::expecting -> std::fmt::Result with Ok(Default::default())"
  text: 'formatter.write_str("a page name or a group")'
  class: equivalent
  why: >-
    骨組みの読み取りで型が合わないときの serde の診断文だけが変わる。
    skeleton::toc は from_str が返す Err を捨てて空の骨組みを返し、診断文を外へ渡さない。
    目次の形の指摘は別の overview::toc の検査が作るので、この文の有無は標準出力、標準エラー、
    終了コードを変えない。別の文脈のレビューが、空の入力、型の違う YAML、別名参照を使って
    診断文を外に出す経路を探したが、いずれも Err がこの場所で捨てられるため見つからなかった。

- file: crates/kotowari-core/src/sources.rs
  change: "replace + with * in parse_links"
  text: "i = href_end + 1;"
  class: equivalent
  why: >-
    TBL-core-023 のリンクを1つ読み終えた後の、走査を再開する位置。
    href_end は最初の ) を探した find が返した位置なので、その文字は必ず ) で [ ではない。
    * 1 にして ) の位置から再開しても、次の反復の先頭の「[ でなければ1つ進めて続ける」で空回りして
    同じ位置に着くだけで、取り出されるリンクの列は変わらない。
    落とすテストの試み: 元の関数と変異を当てた関数を並べ、[ ] ( ) x # あ の7種類からなる文字列を
    長さ8まで全通り、[ ] ( ) x の5種類を長さ11まで全通り（合わせて約6800万件）と長さ24の乱数200万件で
    突き合わせたが、取り出されるリンクの列の違いは1件も無かった。
    再開の位置を href_end + 2 にした版では同じ探索が隣り合うリンクの取りこぼしを見つけるので、
    2つ以上のリンクを区別できる探索であることは確かめてある。

- file: crates/kotowari-core/src/lib.rs
  change: "replace + with * in split_outside_quotes"
  text: "start = i + 1;"
  class: equivalent
  why: >-
    閉じ引用符の次から次の部を始める位置。* 1 にすると次の部の先頭に閉じ引用符の " が付く。
    戻り値は変わるが、3つの消費者のどれも出力が変わらない: バッククォートの偶奇（REQ-core-054）は
    " を数えない、バッククォートの中身の抽出（REQ-core-064、REQ-core-104）は " が対の並びを変えない、
    文書名の参照（REQ-core-069、TBL-core-014）は名前の直前の " を境界として許すので判定が同じ。
    落とすテストの試み: 主セッションが3つの消費者の場合分けをソースで追い、部の先頭の " が
    どの指摘にも現れないことを確かめた（2026-09-19）。判断の記録 2026-09-19-mutants-followup.md の
    A1・A13 のとおり、戻り値の違いは観測に数えない。

- file: crates/kotowari-markdown-schema/src/extract.rs
  change: "replace + with * in render"
  text: "let blank = (last + 1..piece.span.first)"
  class: equivalent
  why: >-
    REQ-schema-063 のつなぎ方で、前の部分の最後の行と次の部分の最初の行の間に空行があるかを見る範囲の始まり。
    * 1 にすると範囲が前の部分の最後の行そのものから始まるが、部分の最後の行は空にならない
    （一覧の行はマーカーの行か lead の段落の最後の行、継続段落は段落の最後の行、文は空でない行）ので、
    範囲に1行増えても空行があるかの答えは変わらない。
    落とすテストの試み: 見出し・一覧の行（字下げ、タブ、名前と値、空のマーカー）・文・空白だけの行・
    囲み・表・引用など26種類の行を1〜9行並べた文書30万件を、節の本文・フィールド行・箇条書き・項目の値を
    抽出するスキーマに段落と行の2つの読み方で通し、元の関数と変異を当てた関数の抽出の値を突き合わせたが、
    違いは1件も無かった。範囲の始まりを last + 2 にした版では同じ探索が55510件の違いを見つけるので、
    空行の有無の違いを見られる探索であることは確かめてある。

- file: crates/kotowari-source-analysis/src/discovery.rs
  change: "replace + with * in reparse_macro_body"
  text: "let byte_offset = body.range().start + usize::from(delimited.is_some());"
  class: equivalent
  why: >-
    マクロの中身が始まるバイトの位置で、開き括弧の1バイトを足している。token_tree は必ず
    "{}"、"()"、"[]" のどれかで囲まれるので delimited は常に Some で、* にすると開き括弧の位置そのものになり1小さくなるだけ。
    この値の使い道は2つ: 行の数（source[..byte_offset] の改行の数）は、ずれる1バイトが開き括弧で改行でないので変わらない。
    テストを並べる鍵（REQ-core-181 と TBL-core-016 の同じ行の判定の順）は、マクロの中の関数どうしでは全部が同じだけずれ、
    マクロの外のテストの節はマクロの token_tree の中から始まれないので、1バイトのずれで前後が入れ替わる相手が無い。
    落とすテストの試み: 主セッションが、マクロの開き括弧と同じ行と、閉じ括弧と同じ行に普通のテストを置く配置を考え、
    外のテストの始まりが中の関数の鍵とその1前の間に入れないことをソースで確かめた（2026-09-24）。

- file: crates/kotowari-markdown-schema/src/ast.rs
  change: 'replace ParseError::detail -> &str with ""'
  text: '&self.0'
  class: equivalent
  why: >-
    ParseError の受け手を作る公開経路が現在の固定依存と GFM・frontmatter の設定では無い。
    Document::parse と ast_json の解析は MDX を有効にせず、mdast の閉じた型の JSON 値化にも
    返却エラーを作る値やコールバックが無い。公開の生成・変換・Deserialize も無いので、空文字の差を観測できない。
    独立した反証の試みは非 MDX の解析エラー、frontmatter、タグ付き enum の Serialize、
    特殊な serializer 名と公開の生成経路を調べたが、対象の ParseError を返す経路を見つけなかった。
    ユーザーがこの置換だけの限定判断を承認した。依存と前提・再検証条件は
    docs/decision/records/2026-10-03-public-crate-api-plan.md の A16 に記録する。
    現行の照合は file・change・text の一致であり、依存や解析設定の変化を自動検知しない。

- file: crates/kotowari-markdown-schema/src/ast.rs
  change: 'replace ParseError::detail -> &str with "xyzzy"'
  text: '&self.0'
  class: equivalent
  why: >-
    現在の固定依存と GFM・frontmatter の設定では ParseError を返す公開経路が無く、
    公開の生成・変換・Deserialize も無い。受け手を取得できないため xyzzy の差を観測できない。
    独立した反証の試みは非 MDX の解析エラーと閉じた mdast の値化の失敗、
    特殊な serializer と公開生成経路を追ったが、対象エラーの生成経路を見つけなかった。
    ユーザーがこの置換だけの限定判断を承認した。依存と前提・再検証条件は
    docs/decision/records/2026-10-03-public-crate-api-plan.md の A16 に記録する。
    現行の照合は file・change・text の一致であり、依存や解析設定の変化を自動検知しない。

- file: crates/kotowari-markdown-schema/src/ast.rs
  change: 'replace <impl std::fmt::Display for ParseError>::fmt -> std::fmt::Result with Ok(Default::default())'
  text: 'f.write_str(&self.0)'
  class: equivalent
  why: >-
    実在する ParseError があれば Display の出力と書き込み失敗は変わるが、現在の固定依存と
    GFM・frontmatter の設定にはその受け手を返す公開経路も公開生成・Deserialize も無い。
    独立した反証では失敗する書き込み先も検討し、受け手が必要なことと、
    非 MDX 解析・タグ付き mdast の JSON 値化がそのエラーを作らないことを確認した。
    ユーザーがこの置換だけの限定判断を承認した。依存と前提・再検証条件は
    docs/decision/records/2026-10-03-public-crate-api-plan.md の A16 に記録する。
    現行の照合は file・change・text の一致であり、依存や解析設定の変化を自動検知しない。

- file: crates/kotowari-overview/src/references.rs
  change: 'replace > with >= in without_date'
  text: 'let is_date = bytes.len() > 11'
  class: equivalent
  why: >-
    > と >= が違う結果になるのは、判断の記録のファイル名が日付と "-" だけの "YYYY-MM-DD-.md" のときだけで、
    厳密には等価でなく、作る者のいない入力での食い違いである（その入力では >= のほうが TBL-core-039 の
    文字どおりに表示名を空にする）。判断の記録はトピックの名前を必ず持つので、この名前を作るものが無い。別の文脈の LLM（変異の見逃しを塞ぐ役）がこの変異を落とすテストを試み、
    実在する入力では書けないと報告した。利用者が等価として登録することを承認した（2026-10-04）。
