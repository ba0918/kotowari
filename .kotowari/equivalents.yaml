# 等価の一覧（docs/ir/core/equivalents.md の REQ-core-141、REQ-core-143）。
# 載せる前に、別の文脈でその変異を落とすテストを書けないか試している。
# why には、なぜ観測できないかと、何を試して落とせなかったかを書く。

- file: crates/kotowari-core/src/sources.rs
  change: "replace + with * in parse_links"
  text: "i = href_end + 1;"
  class: equivalent
  why: >-
    TBL-core-023 のリンクを1つ読み終えた後の、走査を再開する位置。
    href_end は最初の ) を探した find が返した位置なので、その文字は必ず ) で [ ではない。
    * 1 にして ) の位置から再開しても、次の反復の先頭の「[ でなければ1つ進めて続ける」で空回りして
    同じ位置に着くだけで、取り出されるリンクの列は変わらない。
    落とすテストの試み: 元の関数と変異を当てた関数を並べ、[ ] ( ) x # あ の7種類からなる文字列を
    長さ8まで全通り、[ ] ( ) x の5種類を長さ11まで全通り（合わせて約6800万件）と長さ24の乱数200万件で
    突き合わせたが、取り出されるリンクの列の違いは1件も無かった。
    再開の位置を href_end + 2 にした版では同じ探索が隣り合うリンクの取りこぼしを見つけるので、
    2つ以上のリンクを区別できる探索であることは確かめてある。

- file: crates/kotowari-core/src/lib.rs
  change: "replace + with * in split_outside_quotes"
  text: "start = i + 1;"
  class: equivalent
  why: >-
    閉じ引用符の次から次の部を始める位置。* 1 にすると次の部の先頭に閉じ引用符の " が付く。
    戻り値は変わるが、3つの消費者のどれも出力が変わらない: バッククォートの偶奇（REQ-core-054）は
    " を数えない、バッククォートの中身の抽出（REQ-core-064、REQ-core-104）は " が対の並びを変えない、
    文書名の参照（REQ-core-069、TBL-core-014）は名前の直前の " を境界として許すので判定が同じ。
    落とすテストの試み: 主セッションが3つの消費者の場合分けをソースで追い、部の先頭の " が
    どの指摘にも現れないことを確かめた（2026-09-19）。判断の記録 2026-09-19-mutants-followup.md の
    A1・A13 のとおり、戻り値の違いは観測に数えない。

- file: crates/kotowari-markdown-schema/src/extract.rs
  change: "replace + with * in render"
  text: "let blank = (last + 1..piece.span.first)"
  class: equivalent
  why: >-
    REQ-schema-063 のつなぎ方で、前の部分の最後の行と次の部分の最初の行の間に空行があるかを見る範囲の始まり。
    * 1 にすると範囲が前の部分の最後の行そのものから始まるが、部分の最後の行は空にならない
    （一覧の行はマーカーの行か lead の段落の最後の行、継続段落は段落の最後の行、文は空でない行）ので、
    範囲に1行増えても空行があるかの答えは変わらない。
    落とすテストの試み: 見出し・一覧の行（字下げ、タブ、名前と値、空のマーカー）・文・空白だけの行・
    囲み・表・引用など26種類の行を1〜9行並べた文書30万件を、節の本文・フィールド行・箇条書き・項目の値を
    抽出するスキーマに段落と行の2つの読み方で通し、元の関数と変異を当てた関数の抽出の値を突き合わせたが、
    違いは1件も無かった。範囲の始まりを last + 2 にした版では同じ探索が55510件の違いを見つけるので、
    空行の有無の違いを見られる探索であることは確かめてある。
