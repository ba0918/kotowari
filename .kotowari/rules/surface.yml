# kotowari 自身の CLI の面。
# 指摘の種類の名前は skill の参照とコードを突き合わせるテストが見ているので、ここでは取り出さない。

# サブコマンド: 1つ目の位置引数として受けるコマンドの表 COMMANDS の中の文字列
id: subcommand
language: rust
rule:
  kind: string_literal
  pattern: $NAME
  inside:
    kind: const_item
    has:
      field: name
      regex: ^COMMANDS$
    stopBy: end
---
# フラグ: "--" で始まる文字列のうち、match の腕のパターンにあるものと、if の条件で == で比べるもの
id: flag
language: rust
rule:
  kind: string_literal
  regex: ^"--
  pattern: $NAME
  any:
    - inside:
        kind: match_pattern
        stopBy: end
    - inside:
        kind: binary_expression
        has:
          field: operator
          regex: ^==$
        inside:
          kind: if_expression
          field: condition
