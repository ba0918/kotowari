# タグの push を受けて GitHub Release を作る（判断の記録 docs/decision/records/2026-09-26-release-flow.md の A4、A7、A8）。
#
# タグは scripts/release.sh が作り、人が push する。ここではチェックをもう一度回し、
# Linux x86_64 と macOS arm64 のバイナリを作り、変更履歴のその版の節を本文にした Release を作る。
# タグの形は <製品>-v<版>（kotowari-v0.1.0、kotowari-mds-v0.2.0）で、製品から配るものを引く。
name: release

on:
  push:
    tags:
      - "kotowari-v*"
      - "kotowari-mds-v*"
  # タグの push で起動しなかったときに、既にあるタグから Release を作り直さずに作る入口。
  # タグは動かさず、入力したタグを取り出して同じ手順を踏む
  workflow_dispatch:
    inputs:
      tag:
        description: "Release を作るタグ（例: kotowari-v0.1.0）"
        required: true
        type: string

# 書き込みの権限は Release を作るジョブだけに渡す。依存のビルドが走るジョブには読み取りだけ
permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  meta:
    name: タグを読み、リリースノートを切り出す
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.product.outputs.product }}
      version: ${{ steps.product.outputs.version }}
      package: ${{ steps.product.outputs.package }}
      bin: ${{ steps.product.outputs.bin }}
      readme: ${{ steps.product.outputs.readme }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - id: product
        name: タグから製品を引く
        run: |
          if [[ "$TAG" =~ ^(kotowari|kotowari-mds)-v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            product="${BASH_REMATCH[1]}"
            version="${BASH_REMATCH[2]}"
          else
            echo "::error::タグの形が違う: $TAG"
            exit 1
          fi
          case "$product" in
            kotowari)
              package=kotowari
              bin=kotowari
              changelog=CHANGELOG.md
              readme=README.md
              ;;
            kotowari-mds)
              package=kotowari-markdown-schema
              bin=kotowari-mds
              changelog=crates/kotowari-markdown-schema/CHANGELOG.md
              readme=crates/kotowari-markdown-schema/README.md
              ;;
          esac
          {
            echo "product=$product"
            echo "version=$version"
            echo "package=$package"
            echo "bin=$bin"
            echo "changelog=$changelog"
            echo "readme=$readme"
          } >> "$GITHUB_OUTPUT"
      - name: 変更履歴からその版の節を切り出す
        env:
          VERSION: ${{ steps.product.outputs.version }}
          CHANGELOG: ${{ steps.product.outputs.changelog }}
        run: |
          if [ ! -f "$CHANGELOG" ]; then
            echo "::error::変更履歴 $CHANGELOG が無い"
            exit 1
          fi
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { inside = 1; next }
            inside && (/^## / || /^\[[^]]+\]: /) { exit }
            inside { print }
          ' "$CHANGELOG" > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::$CHANGELOG に $VERSION の節が無いか、空"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md

  check:
    name: チェック
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Rust を用意する
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: テスト全件
        run: cargo test --workspace --locked
      - name: kotowari check
        run: cargo run -q --locked -p kotowari -- check --format text
      - name: 版のずれの検査
        run: scripts/check-versions.sh "$TAG"

  # 同じ製品の1つ前のリリースのタグとの差分（前のタグが無ければ全体）の変異を回し、見逃しがあれば
  # バイナリを作らない（判断の記録 docs/decision/records/2026-10-04-mutants-in-ci.md の A4）。
  # 範囲の選び方は scripts/mutants.sh plan に pre-push と同じ形の行を渡して決める
  mutants-scope:
    name: 変異テストの範囲を決める
    needs: meta
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        run: |
          scope="$(printf 'refs/tags/%s %s refs/tags/%s 0\n' "$TAG" "$(git rev-parse "refs/tags/${TAG}^{commit}")" "$TAG" | scripts/mutants.sh plan)"
          echo "scope: $scope"
          printf 'scope=%s\n' "$scope" >>"$GITHUB_OUTPUT"

  mutants:
    needs: mutants-scope
    uses: ./.github/workflows/mutants-run.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}
      scope: ${{ needs.mutants-scope.outputs.scope }}

  build:
    name: ビルド（${{ matrix.target }}）
    needs: [meta, check, mutants]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      PRODUCT: ${{ needs.meta.outputs.product }}
      VERSION: ${{ needs.meta.outputs.version }}
      PACKAGE: ${{ needs.meta.outputs.package }}
      BIN: ${{ needs.meta.outputs.bin }}
      README: ${{ needs.meta.outputs.readme }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Rust を用意する
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"
      - name: ビルド
        run: cargo build --release --locked -p "$PACKAGE" --bin "$BIN" --target "$TARGET"
      - name: 固める
        run: |
          name="${PRODUCT}-v${VERSION}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/$BIN" "dist/$name/"
          cp "$README" "dist/$name/README.md"
          cp LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cd dist
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  release:
    name: Release を作る
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
      - name: Release を作る
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ needs.meta.outputs.product }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$PRODUCT $VERSION" \
            --notes-file release-notes.md \
            dist/*
