# 変異テストを8つに分けて並列に回す、呼び出し専用のワークフロー（判断の記録
# docs/decision/records/2026-10-04-mutants-in-ci.md の A3）。PR（mutants.yml）とリリース（release.yml）が使う。
#
# 分担ごとに scripts/mutants.sh が自分の結果を kotowari mutants に読ませ、等価の一覧の分を除いた
# 見逃しがあれば失敗する。ランナーにはユーザーの systemd が無いので、sudo の systemd-run のスコープで
# メモリに上限をかける（A11）。
name: mutants-run

on:
  workflow_call:
    inputs:
      ref:
        description: 取り出して回す commit か参照
        required: true
        type: string
      scope:
        description: '"diff <基準の commit か参照>" か "full"（scripts/mutants.sh の副コマンドと引数）'
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"
  # メモリ上限つきのスコープで回す（判断の記録 2026-10-04-mutants-in-ci.md の A11）
  MUTANTS_SERVICE: scope
  MUTANTS_JOBS: "1"
  # 手元の scripts/mutants.sh と同じ版（出力の終了コードの扱いがこの版に合わせてある）
  CARGO_MUTANTS_VERSION: "27.1.0"
  SHARDS: "8"
  # 変異1件のテストの時間切れの秒数（同じ記録の A10）
  MUTANTS_TIMEOUT: "20"

jobs:
  shard:
    name: 変異テスト（${{ matrix.shard }}/8）
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Rust を用意する
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install nightly --profile minimal
          rustup default stable
          cargo install cargo-mutants --version "$CARGO_MUTANTS_VERSION" --locked
      - name: 変異テスト
        env:
          SCOPE: ${{ inputs.scope }}
          SHARD: ${{ matrix.shard }}
        run: |
          read -r mode base <<<"$SCOPE"
          case "$mode" in
          diff) scripts/mutants.sh diff "$base" -- --shard "$SHARD/$SHARDS" --timeout "$MUTANTS_TIMEOUT" ;;
          full) scripts/mutants.sh full -- --shard "$SHARD/$SHARDS" --timeout "$MUTANTS_TIMEOUT" ;;
          *) echo "unknown scope: $SCOPE" >&2; exit 1 ;;
          esac
