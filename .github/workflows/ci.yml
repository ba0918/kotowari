# Rust の関門: 整形、lint、テストを PR と main で回す（判断の記録
# docs/decision/records/2026-10-06-ci-rust-gates.md）。main のブランチ保護で必須にするのは "Rust gates" のジョブ。
# ツールチェーンは rust-toolchain.toml の版を入れる。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"

jobs:
  gates:
    name: Rust gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Run the gates
        run: scripts/gates.sh
