# Rust の関門: 整形、lint、テストを PR と main で回す（判断の記録
# docs/decision/records/2026-10-06-ci-rust-gates.md）。main のブランチ保護で必須にするのは "Rust gates" のジョブ。
# ツールチェーンは rust-toolchain.toml の版を入れる。
# 同じジョブで、依存のライセンスと既知の脆弱性も検査する（判断の記録
# docs/decision/records/2026-11-24-unattended-merge.md の A18）。必須の検査を増やさずにマージを止める側に置くため。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_ABOUT_VERSION: "0.9.3"

jobs:
  gates:
    name: Rust gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Run the gates
        run: scripts/gates.sh
      # ビルド済みの cargo-deny を入れる。ソースから入れると数分かかる
      - name: Install cargo-deny
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}
      - name: Check dependency licences and advisories
        run: scripts/deps.sh
      # ビルド済みの cargo-about を入れる
      - name: Install cargo-about
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-about@${{ env.CARGO_ABOUT_VERSION }}
      - name: Check that the third-party licence list can be generated for every released binary
        run: scripts/check-third-party-licenses.sh
