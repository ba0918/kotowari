name: Change conformance
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: '4'
      EVENT_BASE: ${{ github.event.pull_request.base.sha }}
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Fetch event histories
        run: git fetch --no-tags origin "$EVENT_BASE" "$EVENT_HEAD"
      - name: Derive branch comparison
        id: comparison
        run: scripts/change-base.sh pull_request "$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"
      - name: Test
        run: cargo test --workspace
      - name: Check records and specification
        run: cargo run -q -p kotowari -- check --format json
      - name: Check independent change conformance
        env:
          COMPARISON_BASE: ${{ steps.comparison.outputs.base }}
          COMPARISON_HEAD: ${{ steps.comparison.outputs.head }}
        run: cargo run -q -p kotowari -- changes --base "$COMPARISON_BASE" --head "$COMPARISON_HEAD" --phase review --format json
