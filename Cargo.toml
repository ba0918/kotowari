[package]
name = "kotowari"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kotowari"
path = "src/main.rs"

[lib]
name = "kotowari"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1"
globset = "0.4"
walkdir = "2"
serde_json = "1"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"

[dev-dependencies]
assert_cmd = "2"
proptest = "1"
tempfile = "3"
