[package]
name = "kotowari"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "kotowari"
path = "src/main.rs"

[dependencies]
kotowari-core = { path = "crates/kotowari-core" }

[dev-dependencies]
assert_cmd = "2"
proptest = "1"
tempfile = "3"
serde_json = "1"
serde-saphyr = "1"

[workspace]
members = ["crates/kotowari-core", "crates/kotowari-markdown-schema", "crates/kotowari-markdown-schema-io", "crates/kotowari-mds"]
exclude = ["experiments"]
resolver = "3"
