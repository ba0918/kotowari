[package]
name = "kotowari-cli"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/ba0918/kotowari"
description = "CLI for checking normalized specifications and their implementation evidence"

[lints]
workspace = true

[[bin]]
name = "kotowari"
path = "src/main.rs"

[dependencies]
kotowari = { path = "crates/kotowari", version = "0.4.0" }
serde_json = "1"
tiny_http = "0.12"
ctrlc = "3.5"

[dev-dependencies]
kotowari-core = { path = "crates/kotowari-core", version = "0.4.0" }
assert_cmd = "2"
proptest = "1"
tempfile = "3"
serde-saphyr = "1"

[workspace]
members = ["crates/kotowari", "crates/kotowari-core", "crates/kotowari-source-analysis", "crates/kotowari-markdown-schema", "crates/kotowari-markdown-schema-io", "crates/kotowari-markdown-view", "crates/kotowari-overview", "crates/kotowari-mds"]
exclude = ["experiments"]
resolver = "3"

# 版と lint はここで1回だけ宣言し、すべてのメンバーが継承する（判断の記録 docs/decision/records/2026-10-06-ci-rust-gates.md）
[workspace.package]
edition = "2024"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
needless_pass_by_value = "warn"
wildcard_enum_match_arm = "warn"
