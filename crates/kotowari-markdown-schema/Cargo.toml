[package]
name = "kotowari-markdown-schema"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ba0918/kotowari"
readme = "README.md"
keywords = ["markdown", "schema", "validation", "cli"]
categories = ["command-line-utilities", "text-processing"]
description = "Validate Markdown documents against a YAML schema declared in their frontmatter and extract structured values"

[lib]
name = "kotowari_markdown_schema"
path = "src/lib.rs"

[[bin]]
name = "kotowari-mds"
path = "src/main.rs"

[dependencies]
markdown = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
gray_matter = { version = "0.3", features = ["yaml"] }
regex = "1"
serde-saphyr = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
ureq = "3"
walkdir = "2"
serde_path_to_error = "0.1"

[dev-dependencies]
proptest = "1"
assert_cmd = "2"
tempfile = "3"
