[package]
name = "kotowari-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "kotowari_core"
path = "src/lib.rs"

[dependencies]
kotowari-markdown-schema = { path = "../kotowari-markdown-schema" }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1"
globset = "0.4"
walkdir = "2"
serde_json = "1"
ast-grep-core = "=0.45.3"
ast-grep-config = "=0.45.3"
ast-grep-language = "=0.45.3"
regex = "1"
sha2 = "0.10"
markdown = "1"
