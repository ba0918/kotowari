[package]
name = "kotowari"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/ba0918/kotowari"
description = "Explicitly rooted specification operations with optional Tokio adapters"

[dependencies]
tokio = { version = "1.53.1", optional = true, features = ["rt", "sync"] }
kotowari-core = { path = "../kotowari-core", version = "0.3.0" }
kotowari-source-analysis = { path = "../kotowari-source-analysis", version = "0.3.0" }
kotowari-overview = { path = "../kotowari-overview", version = "0.3.0" }
walkdir = "2"
globset = "0.4"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
tempfile = "3"
serde_json = "1"
assert_cmd = "2"

[features]
default = []
tokio = ["dep:tokio"]
