[package]
name = "kotowari-source-analysis"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/ba0918/kotowari"
description = "In-memory source analysis producing core-owned specification facts"

[dependencies]
kotowari-core = { path = "../kotowari-core", version = "0.5.0" }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1"
regex = "1"
ast-grep-core = "=0.45.3"
ast-grep-config = "=0.45.3"
ast-grep-language = "=0.45.3"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
globset = "0.4"
walkdir = "2"

[lints]
workspace = true
