# commit と push のゲート（判断の記録 docs/decision/records/2026-09-17-decision-log.md の A15、A19）
#
# pre-commit: 秘密情報の検査（lefthook の導入前から入っていたグローバルのフック。
#   lefthook install が .git/hooks/pre-commit.old に退避したものをそのまま走らせる）と、
#   kotowari 自身の IR の検査。check はリポジトリの今のコードで走らせる。
#   テスト側の指摘（requirement_without_test、scenario_without_test、test_without_id、invalid_marker、
#   unparsable_file、テストのファイルの unresolved_reference）はコミットでは止めない。
#   仕様の承認のコミットは実装より先で、そのときテストはまだ無いため（A19）。
#   停止（終了コード2）は止める。
#   ステージした Rust のファイルは rustfmt にかけ直してステージし直す。放っておくと整形が崩れていくため。
#   edition は Cargo.toml と同じ 2024 を渡す（rustfmt を直に呼ぶと cargo の edition を読まない）。
# pre-push: テスト全件と、テスト側の指摘も含めた check の終了コード0。テストの無い要求は push で止まる。
#   変異テストはここでは回さない。push のたびに1〜2時間止まっていたため、見逃し0件の関門は
#   PR の CI（.github/workflows/mutants.yml）とリリースの CI（release.yml）に移した
#   （判断の記録 docs/decision/records/2026-10-04-mutants-in-ci.md の A1〜A4）。
pre-commit:
  commands:
    rustfmt:
      glob: "*.rs"
      run: rustfmt --edition 2024 {staged_files}
      stage_fixed: true
    secretlint:
      run: bash "$(git rev-parse --git-common-dir)/hooks/pre-commit.old"
    kotowari-check:
      run: |
        out=$(CARGO_BUILD_JOBS=4 cargo run -q -- check --format json); code=$?
        if [ "$code" -eq 2 ]; then exit 2; fi
        rest=$(printf '%s' "$out" | jq -r '
          [ .findings[]
            | select(.severity == "error")
            | select((.kind | IN("requirement_without_test", "scenario_without_test", "test_without_id", "invalid_marker", "unparsable_file")) | not)
            | select((.kind == "unresolved_reference" and ((.path | startswith("docs/ir/")) | not)) | not)
          ] | .[] | "\(.path):\(.line // "-") [\(.severity)] \(.kind) \(.detail)"')
        if [ -n "$rest" ]; then printf '%s\n' "$rest"; exit 1; fi
pre-push:
  commands:
    cargo-test:
      # git はフックに GIT_DIR などを渡す（worktree からの push で実測）。残したままだと、テストが
      # 一時ディレクトリに作るつもりのリポジトリへの git の操作が、push している本物のリポジトリに向かう
      run: |
        for v in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do unset "$v"; done
        CARGO_BUILD_JOBS=4 cargo test
    kotowari-check:
      run: CARGO_BUILD_JOBS=4 cargo run -q -- check --format text
