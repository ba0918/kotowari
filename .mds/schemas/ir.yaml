# kotowari の IR の話題ごとの文書の書式（ir-form.md の「項目」の表）
name: ir
open: false
document:
  title:
    extract: title
  preamble:
    statement:
      repeat: { min: 1 }
      extract:
        path: scope
        value: value
        of: { line: line, raw: raw }
  sections:
    - name: 要求
      repeat: { min: 0 }
      item:
        id: "^REQ-([a-z][a-z0-9-]*-)?([1-9][0-9]{3,}|[0-9]{3})$"
        repeat: { min: 0 }
        extract:
          path: requirements
          of: { id: id, name: name, line: line }
        fields:
          - name: 種類
            enum: [event_driven, state_driven, ubiquitous, prohibition, invariant, algorithm]
            extract: kind
          - name: 出典
            separator: ","
            extract:
              path: sources
              value: value
              of: { line: line }
          - name: 検証
            enum: [unit, property, proof, review]
            extract: verification
          - name: 定義
            separator: ","
            required: true
            when: { field: 種類, eq: algorithm }
            extract: definitions
          - name: 確かめ方
            required: true
            when: { field: 検証, eq: review }
            extract: how_to_verify
        statement:
          repeat: { min: 1 }
          when: { field: 種類, ne: algorithm }
          extract:
            path: text
            value: value
            of: { line: line, raw: raw }
    - name: 決定表
      repeat: { min: 0 }
      item:
        id: "^TBL-([a-z][a-z0-9-]*-)?([1-9][0-9]{3,}|[0-9]{3})$"
        repeat: { min: 0 }
        extract:
          path: tables
          of: { id: id, name: name, line: line }
        fields:
          - name: 出典
            separator: ","
            extract:
              path: sources
              value: value
              of: { line: line }
        table:
          repeat: { min: 1 }
          extract: rows
        statement:
          repeat: { min: 0 }
          extract:
            path: text
            value: value
            of: { line: line, raw: raw }
    - name: 性質
      repeat: { min: 0 }
      item:
        id: "^PROP-([a-z][a-z0-9-]*-)?([1-9][0-9]{3,}|[0-9]{3})$"
        repeat: { min: 0 }
        extract:
          path: properties
          of: { id: id, name: name, line: line }
        fields:
          - name: 出典
            separator: ","
            extract:
              path: sources
              value: value
              of: { line: line }
        statement:
          repeat: { min: 1 }
          extract:
            path: text
            value: value
            of: { line: line, raw: raw }
    - name: 具体例
      repeat: { min: 0 }
      codeblock:
        lang: gherkin
        repeat: { min: 0 }
        extract:
          path: scenarios
          value: value
          of: { line: line }
