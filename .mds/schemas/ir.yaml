# kotowari の IR の話題ごとの文書の書式（ir-form.md の「項目」の表）
name: ir
open: false
document:
  title:
    extract: title
  preamble:
    statement:
      repeat: { min: 1 }
      extract: scope
  sections:
    - name: 要求
      repeat: { min: 0 }
      item:
        id: "REQ-([a-z][a-z0-9-]*-)?\\d{3,}"
        repeat: { min: 0 }
        extract:
          path: requirements
          of: { id: id, name: name, line: line }
        fields:
          - name: 種類
            enum: [event_driven, state_driven, ubiquitous, prohibition, invariant, algorithm]
            extract: kind
          - name: 出典
            separator: ","
            extract: sources
          - name: 検証
            enum: [unit, property, proof, review]
            extract: verification
          - name: 定義
            separator: ","
            required: true
            when: { field: 種類, eq: algorithm }
            extract: definitions
          - name: 確かめ方
            required: true
            when: { field: 検証, eq: review }
            extract: how_to_verify
        statement:
          required: true
          when: { field: 種類, ne: algorithm }
          extract: text
    - name: 決定表
      repeat: { min: 0 }
      item:
        id: "TBL-([a-z][a-z0-9-]*-)?\\d{3,}"
        repeat: { min: 0 }
        extract:
          path: tables
          of: { id: id, name: name, line: line }
        fields:
          - name: 出典
            separator: ","
            extract: sources
        table:
          repeat: { min: 1 }
          extract: rows
        statement:
          required: false
          extract: text
    - name: 性質
      repeat: { min: 0 }
      item:
        id: "PROP-([a-z][a-z0-9-]*-)?\\d{3,}"
        repeat: { min: 0 }
        extract:
          path: properties
          of: { id: id, name: name, line: line }
        fields:
          - name: 出典
            separator: ","
            extract: sources
        statement:
          required: true
          extract: text
    - name: 具体例
      repeat: { min: 0 }
      codeblock:
        lang: gherkin
        repeat: { min: 0 }
        extract: scenarios
