# kotowari の IR の話題ごとの文書の書式（ir-form.md の「項目」の表）
name: ir
open: false
reading: line
document:
  title:
    extract: title
  preamble:
    statement:
      repeat: { min: 1 }
      extract:
        path: scope
        value: value
        of: { line: line, raw: raw }
  sections:
    - name: Requirements
      repeat: { min: 0 }
      item:
        id: "^REQ-([a-z][a-z0-9-]*-)?([1-9][0-9]{3,}|[0-9]{3})$"
        repeat: { min: 0 }
        extract:
          path: requirements
          of: { id: id, name: name, line: line, end: end }
        fields:
          - name: kind
            enum: [event_driven, state_driven, ubiquitous, prohibition, invariant, algorithm]
            extract: kind
          - name: source
            separator: ","
            extract:
              path: sources
              value: value
              of: { line: line }
          - name: verification
            enum: [unit, property, proof, review]
            extract: verification
          - name: definition
            separator: ","
            required: true
            when: { field: kind, eq: algorithm }
            extract:
              path: definitions
              value: value
              of: { line: line }
          - name: how_to_verify
            required: true
            when: { field: verification, eq: review }
            extract: how_to_verify
        statement:
          repeat: { min: 1 }
          when: { field: kind, ne: algorithm }
          extract:
            path: text
            value: value
            of: { line: line, raw: raw }
    - name: Decision tables
      repeat: { min: 0 }
      item:
        id: "^TBL-([a-z][a-z0-9-]*-)?([1-9][0-9]{3,}|[0-9]{3})$"
        repeat: { min: 0 }
        extract:
          path: tables
          of: { id: id, name: name, line: line, end: end }
        fields:
          - name: source
            separator: ","
            extract:
              path: sources
              value: value
              of: { line: line }
        table:
          repeat: { min: 1 }
          extract: rows
        statement:
          repeat: { min: 0 }
          extract:
            path: text
            value: value
            of: { line: line, raw: raw }
    - name: Properties
      repeat: { min: 0 }
      item:
        id: "^PROP-([a-z][a-z0-9-]*-)?([1-9][0-9]{3,}|[0-9]{3})$"
        repeat: { min: 0 }
        extract:
          path: properties
          of: { id: id, name: name, line: line, end: end }
        fields:
          - name: source
            separator: ","
            extract:
              path: sources
              value: value
              of: { line: line }
        statement:
          repeat: { min: 1 }
          extract:
            path: text
            value: value
            of: { line: line, raw: raw }
    - name: Examples
      repeat: { min: 0 }
      codeblock:
        lang: gherkin
        repeat: { min: 0 }
        extract:
          path: scenarios
          value: value
          of: { line: line }
