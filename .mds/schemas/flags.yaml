# kotowari の IR の問題の記録（FLAGS.md）の書式
name: ir-flags
open: false
document:
  title:
    extract: title
  preamble:
    statement:
      repeat: { min: 0 }
      extract:
        path: scope
        value: value
        of: { line: line, raw: raw }
  sections:
    - name: 問題の記録
      repeat: { min: 0 }
      item:
        id: "^FLAG-([a-z][a-z0-9-]*-)?([1-9][0-9]{3,}|[0-9]{3})$"
        repeat: { min: 0 }
        extract:
          path: flags
          of: { id: id, name: name, line: line }
        fields:
          - name: 種類
            enum: [contradiction, gap, ambiguity]
            extract: kind
          - name: 関係
            separator: ","
            extract:
              path: relations
              value: value
              of: { line: line }
          - name: 出典
            separator: ","
            extract:
              path: sources
              value: value
              of: { line: line }
        statement:
          repeat: { min: 1 }
          extract:
            path: text
            value: value
            of: { line: line, raw: raw }
