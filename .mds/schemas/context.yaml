# kotowari の IR の用語集（CONTEXT.md）の書式
name: ir-context
open: false
reading: line
document:
  title:
    pattern: "^用語集$"
    extract: title
  preamble:
    statement:
      repeat: { min: 0 }
      extract:
        path: scope
        value: value
        of: { line: line, raw: raw }
    table:
      repeat: { min: 1 }
      header: [用語, 意味, 出典]
      select: first
      extract:
        path: glossary
        value: value
        of: { line: line, raw: raw }
  sections: []
